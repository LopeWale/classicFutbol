[project]
name = "psfc-host"
version = "0.1.0"
description = "Parallel Season FC authoritative world host, event-sourced ledger, proposal gate, and replay validator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psfc_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
